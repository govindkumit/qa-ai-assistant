<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QA AI Assistant</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <header>

        <h1>🤖 QA AI Assistant</h1>

        <p>
            Your local AI testing assistant
        </p>

    </header>


    <!-- CHAT -->

    <div
        id="chat-box"
        class="chat-box"
    >
    </div>


    <!-- KNOWLEDGE BASE -->

    <section class="knowledge-base">

        <h2>
            📚 Knowledge Base
        </h2>


        <div class="upload-area">

            <input
                type="file"
                id="file-input"
                accept=".txt,.pdf,.docx,.xlsx"
            >


            <button
                id="upload-button"
                type="button"
                onclick="uploadDocument()"
            >
                Upload Document
            </button>

        </div>

    </section>


    <!-- INPUT -->

    <div class="input-area">


        <input
            type="text"
            id="user-input"
            placeholder="Enter a requirement or QA question..."
            autocomplete="off"
        >


        <button
            id="send-button"
            type="button"
            onclick="sendMessage()"
        >
            Send
        </button>


        <button
            id="analyze-button"
            type="button"
            onclick="analyzeRequirement()"
        >
            Analyze Requirement
        </button>


        <button
            id="generate-button"
            type="button"
            onclick="generateTestCases()"
        >
            Generate Test Cases
        </button>

    </div>


</div>


<script
    src="/static/app.js"
></script>


</body>

</html>
